name: Object Lab 01 - source locked visible ink PNG
on:
  push:
    branches:
      - object-lab/01-shadow-marpple-print-proof-20261109
    paths:
      - 'object-lab/apparel/01-shadow/vendor-export/export_vendor_visible_ink_2600.py'
      - 'object-lab/apparel/01-shadow/vendor-export/test_export_vendor_visible_ink_2600.py'
      - '.github/workflows/object-lab-01-visible-ink-2600.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: object-lab-01-visible-ink
  cancel-in-progress: false
jobs:
  make-and-verify-unapproved-artwork:
    if: github.repository == 'kimkimhs36/tohesar'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned imaging dependencies
        run: python -m pip install 'Pillow==11.3.0' 'CairoSVG==2.8.2'
      - name: Generate PNG from original locked SVG and audit alpha bounds
        run: python object-lab/apparel/01-shadow/vendor-export/export_vendor_visible_ink_2600.py
      - name: Execute 6 QA regression tests including real generated PNG
        working-directory: object-lab/apparel/01-shadow/vendor-export
        run: python -m unittest -v test_export_vendor_visible_ink_2600
      - name: Attach artwork and QA for review
        uses: actions/upload-artifact@v4
        with:
          name: object-lab-01-visible-ink-2600-unapproved
          path: |
            object-lab/apparel/01-shadow/vendor-export/exports/01-SHADOW-IVORY-82MM-CANVAS-2600PX-VISIBLE2500-UNAPPROVED.png
            object-lab/apparel/01-shadow/vendor-export/exports/01-SHADOW-IVORY-82MM-CANVAS-2600PX-VISIBLE2500-UNAPPROVED.qa.json
          if-no-files-found: error
      - name: Save binaries on feature branch only if fast-forward push succeeds
        if: github.event_name == 'push' && github.ref == 'refs/heads/object-lab/01-shadow-marpple-print-proof-20261109'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add object-lab/apparel/01-shadow/vendor-export/exports/01-SHADOW-IVORY-82MM-CANVAS-2600PX-VISIBLE2500-UNAPPROVED.png
          git add object-lab/apparel/01-shadow/vendor-export/exports/01-SHADOW-IVORY-82MM-CANVAS-2600PX-VISIBLE2500-UNAPPROVED.qa.json
          if git diff --cached --quiet; then
            echo 'Already tracked at identical bytes, no commit.'
          else
            git commit -m 'build(object-lab 01): store source-locked visible-ink 2600px print candidate [skip ci]'
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
