name: TOHEŞAR Pages — editorial news refresh
on:
  push:
    branches: [main]
  schedule:
    - cron: '37 0,6,12,18 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tohesar-pages
  cancel-in-progress: false
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate RSS parsing and failure behavior
        run: python3 -m unittest discover -s scripts -p "test_news.py"
      - name: Block mismatched or unverified Korean news before deployment
        run: |
          python3 -m unittest discover -s scripts -p 'test_news_pipeline.py'
          python3 scripts/news_pipeline.py check
      - uses: actions/configure-pages@v5
      # The repository also has an automatic branch-based Pages deployment.
      # Persist metadata to source HTML so either deploy pipeline publishes
      # the same canonical/search directives. Do not rewrite article bodies.
      - name: Materialize canonical SEO in source for both Pages pipelines
        run: |
          python3 scripts/seo.py --root .
          python3 scripts/seo.py --root . --check
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "SEO 034: sync canonical metadata to published source"
            git push origin HEAD:main
          fi
      - name: Assemble existing official site without changing its files
        run: |
          mkdir -p _site
          tar --exclude=.git --exclude=_site --exclude=.github --exclude=docs --exclude=scripts --exclude=./journal/inbox -cf - . | (cd _site && tar xf -)
      - name: Refresh attributed public feeds; retain snapshot on failure
        run: python3 scripts/refresh_news.py --output _site/edition/data/news.json
      - name: Curate public search metadata and canonical sitemap
        run: |
          python3 scripts/seo.py --root _site
          python3 scripts/seo.py --root _site --check
      - name: Validate site and source integrity
        run: python3 scripts/test_edition.py --root _site
      - name: Reject public links into directories excluded from Pages
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          from urllib.parse import unquote, urljoin, urlsplit
          import posixpath

          root = Path('_site')
          excluded = ('docs', 'scripts', '.github', 'journal/inbox')
          attrs = {'a': 'href', 'area': 'href', 'link': 'href',
                   'script': 'src', 'img': 'src', 'iframe': 'src',
                   'source': 'src', 'form': 'action'}

          class Refs(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []

              def handle_starttag(self, tag, attributes):
                  name = attrs.get(tag)
                  ref = dict(attributes).get(name) if name else None
                  if ref:
                      self.refs.append(ref)

          failures = []
          pages = sorted(root.rglob('*.html'))
          if not pages:
              raise SystemExit('FAIL: No HTML in assembled Pages artifact')
          count = 0
          for page in pages:
              route = '/' + page.relative_to(root).as_posix()
              if route.endswith('/index.html'):
                  route = route[:-len('index.html')]
              parser = Refs()
              parser.feed(page.read_text(encoding='utf-8'))
              for ref in parser.refs:
                  count += 1
                  target = urlsplit(urljoin('https://tohesar.com' + route, ref.strip()))
                  if target.scheme not in ('http', 'https') or target.hostname not in ('tohesar.com', 'www.tohesar.com'):
                      continue
                  path = posixpath.normpath(unquote(target.path)).lstrip('/')
                  if any(path == d or path.startswith(d + '/') for d in excluded):
                      failures.append((page.relative_to(root).as_posix(), ref))
          for source, ref in failures:
              print(f'BROKEN-PUBLIC-REF {source} -> {ref}')
          if failures:
              raise SystemExit(f'FAIL: {len(failures)} links point into excluded build folders')
          print(f'PASS: {len(pages)} published HTML pages, {count} references; no excluded-folder links')
          PY
      - name: Verify GitHub Pages storage budget and block accidental draft exposure
        run: |
          python3 -m unittest discover -s scripts -p 'test_site_budget.py' -v
          python3 scripts/site_budget.py --root _site --max-mib 850
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Reject stale builds before deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api repos/${{ github.repository }}/commits/main --jq .sha)" = "$(git rev-parse HEAD)"
      - uses: actions/deploy-pages@v4
        id: deployment