name: TOHEŞAR Living Icons QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'journal/assets/border-icons030*'
      - 'journal/assets/living-icons/**'
      - 'journal/assets/travel.js'
      - 'tests/living-icons030.cjs'
      - '.github/workflows/living-icons029-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source and publishing
        run: |
          node --check journal/assets/travel.js
          node --check journal/assets/border-icons030.js
          node --check tests/living-icons030.cjs
          python3 scripts/publish.py check
      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.57.0
          npx playwright install --with-deps chromium webkit
      - name: Run browser checks
        env:
          BASE_URL: http://127.0.0.1:8765
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/tohesar-http.log 2>&1 &
          sleep 2
          node tests/living-icons030.cjs
          node tests/navigation.cjs
