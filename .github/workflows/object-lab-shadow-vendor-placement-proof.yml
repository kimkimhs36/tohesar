name: OBJECT LAB / Shadow 01 vendor placement reference

on:
  push:
    branches:
      - object-lab/apparel-first-drop-r02-20261109
    paths:
      - .github/workflows/object-lab-shadow-vendor-placement-proof.yml
      - object-lab/apparel/first-drop/export_shadow_front_vendor_reference.py
      - object-lab/apparel/first-drop/01-SHADOW-SOURCE-LOCKED-FRONT.svg
      - assets/wordmark.svg
  workflow_dispatch:

permissions:
  contents: write

jobs:
  render-source-locked-placement:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install SVG renderer
        run: python -m pip install 'CairoSVG==2.8.2' 'Pillow>=11,<13'
      - name: Verify exact original wordmark path and render original flatlay
        run: python object-lab/apparel/first-drop/export_shadow_front_vendor_reference.py
      - name: Upload validated vendor reference
        uses: actions/upload-artifact@v4
        with:
          name: shadow-01-vendor-placement-reference-r02
          retention-days: 30
          if-no-files-found: error
          path: |
            object-lab/apparel/first-drop/exports/01-shadow-uniform/*.png
            object-lab/apparel/first-drop/exports/01-shadow-uniform/FRONT-PLACEMENT-MANIFEST.json
      - name: Preserve reference and QC manifest in source branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/object-lab/apparel-first-drop-r02-20261109'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add object-lab/apparel/first-drop/exports/01-shadow-uniform
          if ! git diff --cached --quiet; then
            git commit -m "object-lab: save inspected 01 source-locked placement PNG [skip ci]"
            git push
          fi
