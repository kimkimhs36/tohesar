name: OBJECT LAB / Actual charcoal sample intake ZIP
on:
  push:
    branches:
      - object-lab/apparel-first-drop-r02-20261109
    paths:
      - .github/workflows/object-lab-charcoal-sample-handoff.yml
      - object-lab/apparel/first-drop/build_becanvas_charcoal_handoff.py
      - object-lab/apparel/first-drop/01-SHADOW-CHEST-82MM-ORIGINAL-PATH-IVORY.svg
      - object-lab/apparel/first-drop/exports/01-shadow-uniform/SHADOW-01-VENDOR-FRONT-PLACEMENT-REFERENCE-R02.png
      - assets/wordmark.svg
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verified-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG checker
        run: python -m pip install 'Pillow>=11,<13'
      - name: Retrieve original 600 DPI binary from verified production studio branch
        shell: bash
        run: |
          mkdir -p .objectlab-tmp
          git fetch --no-tags origin refs/heads/object-lab/print-production-studio-20261109
          git show FETCH_HEAD:object-lab/production-studio/exports/01-shadow-uniform/SHADOW-UNIFORM-01-82mm-IVORY-600DPI.png > .objectlab-tmp/actual-600dpi-original.png
      - name: Produce standalone vendor-intake package with CRC, SHA and dimensions QC
        run: |
          python object-lab/apparel/first-drop/build_becanvas_charcoal_handoff.py .objectlab-tmp/actual-600dpi-original.png
      - name: Archive ready-to-download ZIP
        uses: actions/upload-artifact@v4
        with:
          name: shadow-01-becanvas-charcoal-intake-zip
          retention-days: 30
          if-no-files-found: error
          path: |
            object-lab/apparel/first-drop/vendor-handoff/*.zip
            object-lab/apparel/first-drop/vendor-handoff/HANDOFF-QC-RESULT.json
      - name: Preserve physical package and QC in feature branch, unmerged
        if: github.event_name == 'push' && github.ref == 'refs/heads/object-lab/apparel-first-drop-r02-20261109'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add object-lab/apparel/first-drop/vendor-handoff/*.zip object-lab/apparel/first-drop/vendor-handoff/HANDOFF-QC-RESULT.json
          if ! git diff --cached --quiet; then
            git commit -m "object-lab: archive actual 01 charcoal supplier intake ZIP [skip ci]"
            git push
          fi
