name: Publish TOHESAR Genesis 03 homepage

on:
  push:
    branches:
      - experiment/next-generation-genesis-gradient-20261015

concurrency:
  group: genesis-homepage-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: genesis-01/package-lock.json
      - name: Build Genesis production assets
        working-directory: genesis-01
        run: |
          npm ci
          npm run build
          test -s dist/index.html
          test -n "$(ls -A dist/assets)"
      - name: Check gradient scene and script syntax
        working-directory: genesis-01
        run: |
          node --check src.js
          node --check motion.js
          node --check revelation.js
          node --check scripts/gradient-smoke.cjs
          node --check scripts/optical-qa.cjs
          node scripts/motion-qa.mjs
          grep -q 'animation:skyOrbit' style.css
          grep -q -- '--sky-shift-x' src.js
          echo "Production build and static scene checks passed"
      - name: Publish /genesis/ and update the homepage asset references
        run: |
          set -euo pipefail
          git fetch origin main
          mkdir -p /tmp/tohesar-main-checkout
          git worktree add --detach /tmp/tohesar-main-checkout origin/main
          mkdir -p /tmp/tohesar-main-checkout/genesis
          cp -a genesis-01/dist/. /tmp/tohesar-main-checkout/genesis/
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path('/tmp/tohesar-main-checkout')
          old = (root / 'index.html').read_text()
          html = Path('genesis-01/dist/index.html').read_text()
          # Preserve the official metadata while installing the tested build.
          metadata = re.findall(r'<meta name="description"[^>]*>|<link rel="icon"[^>]*>', old)
          html = html.replace('<head>', '<head>\n<base href="/genesis/">\n' + '\n'.join(metadata), 1)
          (root / 'index.html').write_text(html)
          PY
          cat > /tmp/tohesar-main-checkout/genesis/SOURCE.txt <<EOF
          TOHEŞAR Genesis 03 - Memory Alloy
          Source branch: experiment/next-generation-genesis-gradient-20261015
          Source SHA: ${GITHUB_SHA}
          Release scope: /genesis/ and official homepage index.html
          EOF
          git -C /tmp/tohesar-main-checkout add genesis/ index.html
          if git -C /tmp/tohesar-main-checkout diff --cached --quiet; then
            echo "Homepage already up to date"
          else
            git -C /tmp/tohesar-main-checkout config user.name "github-actions[bot]"
            git -C /tmp/tohesar-main-checkout config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git -C /tmp/tohesar-main-checkout commit -m "release(genesis): publish sculpted titanium Genesis 03 homepage"
            git -C /tmp/tohesar-main-checkout push origin HEAD:main
          fi
