name: Genesis 02 art-pass visual checks

on:
  push:
    branches:
      - experiment/next-generation-genesis-artpass-20261015

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    defaults:
      run:
        working-directory: genesis-01
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: genesis-01/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start preview server
        run: npm run dev -- --host 127.0.0.1 > /tmp/genesis-vite.log 2>&1 &
      - name: Wait for server
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/genesis-vite.log
          exit 1
      - name: Render critical frames and verify optical alignment
        run: node scripts/artpass-check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: genesis-artpass-render-check
          path: |
            genesis-01/captures/artpass-*.png
            genesis-01/captures/artpass-report.json
          retention-days: 7
