<section class="air-sequence" id="air-study" aria-labelledby="air-title"><div class="air-board"><div class="air-copy"><h2 id="air-title">낮게 시작하고,<br>끝에서 솟아오르다.</h2><p>앞부분의 수평선에서 옆면의 깊이로,<br>그리고 뒤쪽의 큰 윙으로 시선을 옮겨 보세요.</p></div><figure><img src="/edition/assets/f40-1600.webp" srcset="/edition/assets/f40-800.webp 800w, /edition/assets/f40-1600.webp 1600w" sizes="(max-width:700px) 100vw, 90vw" width="1600" height="869" loading="lazy" alt="전시된 빨간 Ferrari F40의 낮은 앞부분과 옆면, 뒤쪽 윙"><figcaption><a href="https://commons.wikimedia.org/wiki/File:1991_Ferrari_F40_Red.jpg">사진 MrWalkr</a> · <a href="https://creativecommons.org/licenses/by-sa/4.0/">CC BY-SA 4.0</a> · WebP 변환</figcaption></figure><div class="air-notes"><p data-scene-caption><b>01 — 낮은 면</b>코에서 시작한 수평선이 차의 낮고 넓은 자세를 만듭니다.</p><p data-scene-caption><b>02 — 비워 둔 깊이</b>옆면의 어두운 흡입구가 밝은 차체의 면과 대비됩니다.</p><p data-scene-caption><b>03 — 마지막 수평선</b>지붕 너머 높아지는 윙이 차체의 끝을 다시 강조합니다.</p></div></div></section>
