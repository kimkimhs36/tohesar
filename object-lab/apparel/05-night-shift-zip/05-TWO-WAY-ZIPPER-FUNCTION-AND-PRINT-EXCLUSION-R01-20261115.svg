<text x="60" y="806" font-size="20">02 — PHYSICAL SAMPLE RELEASE TEST</text>
<text x="60" y="832" font-size="15">Cycle both sliders 20 times; record snags, tape rippling, hem rise, seated comfort, and print/zipper clearance in mm.</text>
<text x="60" y="855" font-size="15">The 20-cycle count is an internal screening proposal, NOT an industry standard or supplier guarantee.</text>
