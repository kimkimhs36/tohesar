<text x="655" y="225" font-size="19">DESIGN INTENT</text>
<text x="655" y="255">• Seller-listed 2-way zipper is a real functional requirement.</text>
<text x="655" y="282">• Upper slider: normal open / close movement.</text>
<text x="655" y="309">• Lower slider: hem vent when seated or cycling.</text>
<text x="655" y="336">• Quiet chest artwork: illustrative box only, NOT approved print.</text>
<text x="655" y="363">• Front-pocket and zipper clearance must be measured.</text>
<text x="655" y="405" fill="#a04335">DO NOT infer printable area from this drawing.</text>
<text x="655" y="440">Candidate: MARPPLE 9362 (seller-listed 400gsm, 2-way).</text>
<text x="655" y="467">Actual blank dimensions, artwork location and wash QC pending.</text>
