<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297">
<rect width="210" height="297" fill="white"/>
<g font-family="Arial,sans-serif" fill="#222">
<text x="18" y="20" font-size="6" font-weight="bold">01 SHADOW / PRINT SCALE CONTROL</text>
<text x="18" y="27" font-size="3.5">A4 / print at 100% / no fit-to-page / measure before use</text>
<text x="18" y="37" font-size="3.5">Physical width target: 82.0 mm. NOT a logo or vendor proof.</text>
</g>
<path d="M 18 54 H 100 M 18 50 V 58 M 100 50 V 58" fill="none" stroke="black" stroke-width="0.3"/>
<text x="59" y="49" text-anchor="middle" font-family="Arial" font-size="4">82.0 mm</text>
<path d="M 18 78 H 68 M 18 75 V 81 M 68 75 V 81" stroke="black" stroke-width="0.3" fill="none"/>
<text x="43" y="73" text-anchor="middle" font-family="Arial" font-size="3.5">50.0 mm cross-check</text>
<path d="M 18 94 H 118 M 18 91 V 97 M 118 91 V 97" stroke="black" stroke-width="0.3" fill="none"/>
<text x="68" y="89" text-anchor="middle" font-family="Arial" font-size="3.5">100.0 mm cross-check</text>
<text x="18" y="114" font-family="Arial" font-size="3.8">Measure horizontal lines with a ruler. If off-scale, STOP.</text>
<text x="18" y="123" font-family="Arial" font-size="3.8">Reference only: 82mm is artboard width, not ink bounding width.</text>
<text x="18" y="132" font-family="Arial" font-size="3.8">Do not infer chest placement, underbase, or garment size.</text>
<text x="18" y="141" font-family="Arial" font-size="3.8">No supplier upload, order, or payment authorization.</text>
</svg>